<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dim: rgba(201,168,76,0.15);
  --black: #080808;
  --black2: #111;
  --black3: #1A0A0A;
  --white: #F5F0F0;
  --gray: #888;
  --border: rgba(201,168,76,0.12);
  --red: #C0392B;
  --red-light: #E74C3C;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--black);
  color:var(--white);
  font-family:'Inter',sans-serif;
  font-weight:300;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 48px;
  border-bottom:1px solid var(--border);
  background:rgba(8,8,8,0.92);
  backdrop-filter:blur(12px);
}
.nav-logo{
  color:var(--white);
  text-decoration:none;
  display:flex;align-items:center;gap:14px;
}
.nav-logo .logo-mark{
  width:44px;height:44px;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Georgia',serif;
  font-size:20px;font-weight:700;
  color:var(--black);letter-spacing:-1px;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  transition:transform .3s ease;
}
.nav-logo:hover .logo-mark{transform:rotate(30deg);}
.nav-logo .logo-text{
  font-family:'Syne',sans-serif;
  font-size:18px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
}
.nav-logo .logo-text span{color:var(--gold);}
.nav-logo .dot{color:var(--gold);}
.nav-links{display:flex;gap:32px;list-style:none;}
.nav-links a{
  font-size:12px;letter-spacing:1px;color:var(--gray);
  text-decoration:none;text-transform:uppercase;
  transition:color .2s;
}
.nav-links a:hover{color:var(--gold);}
.nav-cta{
  background:var(--red);color:var(--white);
  padding:10px 24px;font-size:12px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;
  text-decoration:none;font-family:'Syne',sans-serif;
  transition:background .2s;
}
.nav-cta:hover{background:var(--red-light);}

/* TICKER */
.ticker-wrap{
  margin-top:65px;
  background:var(--red);
  overflow:hidden;
  padding:12px 0;
  white-space:nowrap;
}
.ticker-track{
  display:inline-flex;
  animation:ticker 20s linear infinite;
}
.ticker-track span{
  font-family:'Syne',sans-serif;
  font-size:12px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--white);
  padding:0 40px;
}
.ticker-track span.sep{color:rgba(255,255,255,0.4);}
@keyframes ticker{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* HERO */
.hero{
  min-height:92vh;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:80px 48px 60px;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--border);
}
.hero-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 50% 70% at 90% 50%, rgba(192,57,43,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 30% 40% at 10% 90%, rgba(201,168,76,0.06) 0%, transparent 50%);
  pointer-events:none;
}
.hero-label{
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);margin-bottom:32px;
  display:flex;align-items:center;gap:12px;
}
.hero-label::before{content:'';width:32px;height:1px;background:var(--gold);}
.hero h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(56px,9vw,120px);
  font-weight:800;
  line-height:.95;
  letter-spacing:-2px;
  max-width:900px;
  margin-bottom:40px;
}
.hero h1 em{font-style:italic;color:var(--gold);font-weight:400;}
.hero-sub{
  font-size:16px;line-height:1.8;color:var(--gray);
  max-width:480px;margin-bottom:56px;
}
.hero-actions{display:flex;gap:16px;align-items:center;}
.btn-primary{
  background:var(--red);color:var(--white);
  padding:16px 36px;font-size:13px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  text-decoration:none;font-family:'Syne',sans-serif;
  display:inline-flex;align-items:center;gap:12px;
  transition:background .2s;
}
.btn-primary:hover{background:var(--red-light);}
.btn-secondary{
  color:var(--gray);font-size:13px;letter-spacing:1px;
  text-decoration:none;text-transform:uppercase;
  border-bottom:1px solid var(--border);
  padding-bottom:2px;transition:color .2s,border-color .2s;
}
.btn-secondary:hover{color:var(--gold);border-color:var(--gold);}

/* STATS */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--border);
}
.stat{

.stat-num{

  color:var(--gold);line-height:1;

.stat-label{font-size:12px;color:var(--gray);letter-spacing:1px;text-transform:uppercase;}<!-- LEISTUNGEN -->

<script>
// FAQ
document.querySelectorAll('.faq-q').forEach(btn => {
  btn.addEventListener('click', () => {
    const item = btn.parentElement;
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  });
});

// Scroll reveal
const obs = new IntersectionObserver((entries) => {
  entries.forEach((e, i) => {
    if (e.isIntersecting) {
      setTimeout(() => e.target.classList.add('visible'), i * 80);
    }
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

// POPUPS
const impressumModal = document.getElementById("impressumModal");
const datenschutzModal = document.getElementById("datenschutzModal");

document.getElementById("openImpressum").onclick = () => impressumModal.style.display = "flex";
document.getElementById("closeImpressum").onclick = () => impressumModal.style.display = "none";

document.getElementById("openDatenschutz").onclick = () => datenschutzModal.style.display = "flex";
document.getElementById("closeDatenschutz").onclick = () => datenschutzModal.style.display = "none";
</script>
